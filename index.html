<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Query Workbook</title>
<meta name="description" content="SQL practice on a made-up bank database: window functions, joins, NULL traps and Spark query cost. Runs in your browser with DuckDB.">
<meta name="theme-color" content="#fbfaf7">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Topics and drills">
    <div class="side-head">
      <a href="#" class="brand">Query Workbook</a>
      <button class="icon-btn close-side" data-action="close-side" aria-label="Close topics">✕</button>
    </div>
    <div id="topics"></div>
    <p class="side-foot">A made-up bank database, running in your browser with DuckDB. Progress is saved on this device.
      <button class="link" data-action="reset-progress">Reset progress</button></p>
  </nav>
  <div class="scrim" data-action="close-side"></div>

  <div class="work">
    <header class="phone-head">
      <button class="icon-btn" data-action="open-side" aria-label="Topics">☰</button>
      <span id="phone-where"></span>
      <span class="icon-spacer"></span>
    </header>
    <div class="tabs" role="tablist" aria-label="Drill sections">
      <button role="tab" data-pane="task" aria-selected="true">Task</button>
      <button role="tab" data-pane="query" aria-selected="false">Query</button>
      <button role="tab" data-pane="result" aria-selected="false">Result</button>
    </div>
    <main id="main"><p class="loading">Loading…</p></main>
  </div>
</div>
</body>
</html>
